name: Rapport hebdo
description: Écrit un rapport puis affiche son contenu.
inputs:
  projet: Portail usagers
steps:
  - id: ecrire
    type: file_write
    path: 'tmp\rapport.txt'
    content: "Rapport du projet {{projet}} du {{today}}"
  - id: afficher
    type: log
    message: "Fichier écrit : {{ecrire.output}}"