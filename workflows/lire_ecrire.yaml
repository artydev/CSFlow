# yaml-language-server: $schema=../csflow.schema.json
name: Écrire puis relire
steps:
  - id: ecrire
    type: file_write
    path: 'tmp\bonjour.txt'
    content: "Rapport généré le {{today}}"
  - id: relire
    type: file_read
    path: 'tmp\bonjour.txt'
  - id: afficher
    type: log
    level: success
    message: "Contenu du fichier : {{relire.output}}"
  - id: info
    type: log
    level: info
    message: "Le fichier a été écrit dans tmp\\bonjour.txt"