# yaml-language-server: $schema=../csflow.schema.json
name: users
description: Récupère les utilisateurs de dummyjson, écrit un fichier XLSX puis ouvre Excel pour afficher le résultat (Windows).

steps:

  # ── 1. récupérer les utilisateurs depuis l'API dummyjson ───────────────────
  - id: fetch_users
    type: http_get
    description: Récupération des utilisateurs (dummyjson)
    url: 'https://dummyjson.com/users?limit=80'
    headers:
      User-Agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
      Accept: 'application/json'
    timeout: 30

  # ── 2. sauvegarder la réponse JSON brute ───────────────────────────────────
  - id: save_json
    type: file_write
    description: Sauvegarde de la réponse JSON
    path: 'tmp\users.json'
    content: '{{fetch_users.body}}'

  # ── 3. écrire le script de conversion JSON → XLSX ──────────────────────────
  - id: write_script
    type: file_write
    description: Écriture du script de conversion
    path: 'tmp\users_to_xlsx.py'
    content: |
      import json, zipfile

      # Un fichier .xlsx est une archive ZIP contenant des fichiers XML.
      # On construit ici un classeur minimal (une feuille) avec la bibliothèque standard.

      with open('tmp/users.json', encoding='utf-8') as f:
          data = json.load(f)

      users = data.get('users', [])
      columns = ['id', 'firstName', 'lastName', 'email', 'phone', 'username', 'gender', 'age']

      def esc(v):
          return (str(v).replace('&', '&amp;').replace('<', '&lt;')
                         .replace('>', '&gt;').replace('"', '&quot;'))

      # Lignes de la feuille : en-tête + une ligne par utilisateur
      rows = [columns] + [[u.get(c, '') for c in columns] for u in users]

      # [Content_Types].xml
      content_types = (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
          '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
          '<Default Extension="xml" ContentType="application/xml"/>'
          '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
          '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
          '</Types>'
      )

      # _rels/.rels
      root_rels = (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
          '</Relationships>'
      )

      # xl/_rels/workbook.xml.rels
      wb_rels = (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
          '</Relationships>'
      )

      # xl/workbook.xml
      workbook = (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
          'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
          '<sheets><sheet name="Users" sheetId="1" r:id="rId1"/></sheets>'
          '</workbook>'
      )

      # xl/worksheets/sheet1.xml
      sheet_rows = []
      for r_idx, row in enumerate(rows, start=1):
          cells = []
          for c_idx, val in enumerate(row, start=1):
              ref = chr(64 + c_idx) + str(r_idx)
              if isinstance(val, (int, float)) and not isinstance(val, bool):
                  cells.append('<c r="%s"><v>%s</v></c>' % (ref, val))
              else:
                  cells.append('<c r="%s" t="inlineStr"><is><t>%s</t></is></c>' % (ref, esc(val)))
          sheet_rows.append('<row r="%d">%s</row>' % (r_idx, ''.join(cells)))

      sheet = (
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
          '<sheetData>%s</sheetData>'
          '</worksheet>' % ''.join(sheet_rows)
      )

      # Assemblage de l'archive
      with zipfile.ZipFile('tmp/users.xlsx', 'w', zipfile.ZIP_DEFLATED) as z:
          z.writestr('[Content_Types].xml', content_types)
          z.writestr('_rels/.rels', root_rels)
          z.writestr('xl/workbook.xml', workbook)
          z.writestr('xl/_rels/workbook.xml.rels', wb_rels)
          z.writestr('xl/worksheets/sheet1.xml', sheet)

      print(f'{len(users)} utilisateurs ecrits dans tmp/users.xlsx')

  # ── 4. exécuter le script ─────────────────────────────────────────────────
  - id: to_xlsx
    type: python
    description: Conversion JSON → XLSX
    script: 'tmp\users_to_xlsx.py'

  # ── 5. ouvrir le XLSX dans Excel ───────────────────────────────────────────
  - id: open_excel
    type: shell
    description: Ouverture du XLSX dans Excel
    cmd: 'start "" tmp\users.xlsx'

  # ── 6. fin ─────────────────────────────────────────────────────────────────
  - id: done
    type: log
    level: success
    message: "Terminé : {{to_xlsx.output}} — Excel a été ouvert."
