# yaml-language-server: $schema=../csflow.schema.json
# ════════════════════════════════════════════════════════════════════════════
#  veille-datagouv — nouvelle donnée ouverte sur data.gouv.fr
# ════════════════════════════════════════════════════════════════════════════
#
#  Ce que ça fait :
#    1. interroge l'API publique data.gouv.fr (lecture seule, aucune
#       inscription requise) : https://www.data.gouv.fr/api/1/datasets/ ;
#    2. retient les jeux de données créés depuis N jours (input « jours »,
#       par défaut 7) et, si un input « themes » est fourni, filtre par
#       mots-clés sur le titre + description (séparés par des virgules) ;
#    3. produit un digest HTML (titre cliquable, organisme, date, extrait
#       de description) et ouvre le navigateur par défaut.
#
#  Préréquis : connexion internet (pas d'API clé). Aucun worker CSAgent
#  requis : le flux est 100 % déterministe en Python standard.
#
#  Compatibilité Windows / Linux : HTTP en Python (urllib), chemins en « / »,
#  navigateur par défaut via la stdlib webbrowser.
#
#  Sorties : tmp/veille-dg/ (datasets.json, digest HTML).
#
#  Limite connue : l'API renvoie les jeux récents sans tri stable par date —
#  le flux parcourt jusqu'à 300 entrées pour couvrir la fenêtre demandée.
# ════════════════════════════════════════════════════════════════════════════
name: veille-datagouv
description: >-
  Veille de la donnée ouverte : nouveaux jeux de données créés sur
  data.gouv.fr depuis N jours, filtre par mots-clés optionnel, digest
  HTML cliquable.

inputs:
  jours: 7        # fenêtre de veille en jours
  themes: ""      # mots-clés séparés par des virgules, ex : "santé, budget" (vide = tous)

steps:

  # ── 1. récupération et filtrage via l'API data.gouv.fr ─────────────────────
  - id: recuperer
    type: python
    description: Récupération des nouveaux jeux de données (API data.gouv.fr)
    code: |
      import datetime, json, pathlib, urllib.parse, urllib.request
      jours = int("{{jours}}".strip() or "7")
      themes = [t.strip().lower() for t in "{{themes}}".split(",") if t.strip()]
      limite = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=jours)

      def get(url):
          req = urllib.request.Request(url, headers={"User-Agent": "csflow-veille/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              return json.loads(r.read().decode("utf-8"))

      vus, entrées, page = set(), [], 1
      while page <= 3:
          url = "https://www.data.gouv.fr/api/1/datasets/?page=" + str(page) + "&page_size=100"
          data = get(url).get("data", [])
          if not data:
              break
          for d in data:
              did = d.get("id")
              if did in vus:
                  continue
              vus.add(did)
              try:
                  date = datetime.datetime.fromisoformat(d.get("created_at", ""))
              except Exception:
                  continue
              if date.tzinfo is None:
                  date = date.replace(tzinfo=datetime.timezone.utc)
              if date < limite:
                  continue
              titre = (d.get("title") or "").lower()
              texte = ((d.get("description") or "") + " " + (d.get("title") or "")).lower()
              if themes and not any(t in texte for t in themes):
                  continue
              org = (d.get("organization") or {}).get("name", "—")
              entrées.append({
                  "titre": d.get("title") or "sans titre",
                  "url": d.get("page") or d.get("url") or "https://www.data.gouv.fr/fr/datasets/" + str(did),
                  "organisme": org,
                  "date": d.get("created_at", "")[:10],
                  "description": (d.get("description") or "")[:220],
              })
          if len(data) < 100:
              break
          page += 1
      entrées.sort(key=lambda e: e["date"], reverse=True)
      dossier = pathlib.Path("tmp/veille-dg")
      dossier.mkdir(parents=True, exist_ok=True)
      (dossier / "datasets.json").write_text(json.dumps(entrées, ensure_ascii=False, indent=2), encoding="utf-8")
      print(f"{len(entrées)} jeu(x) de données depuis {jours} jour(s)" + (f" (thèmes : {', '.join(themes)})" if themes else "") + ".")

  # ── 2. digest HTML ─────────────────────────────────────────────────────────
  - id: rapport
    type: python
    description: Génération du digest HTML
    code: |
      import html, json, pathlib
      p = pathlib.Path
      entrées = json.loads(p("tmp/veille-dg/datasets.json").read_text(encoding="utf-8"))
      lignes = []
      lignes.append('<h1>Veille data.gouv.fr</h1>')
      lignes.append(f'<div class="sub">{len(entrées)} nouveau(x) jeu(x) de données — {html.escape("{{now}}")}</div>')
      if not entrées:
          lignes.append('<p>Aucun jeu de données ne correspond à la fenêtre ou aux thèmes demandés.</p>')
      for e in entrées:
          lignes.append('<div class="carte">')
          lignes.append(f'<h2><a href="{html.escape(e["url"])}" target="_blank">{html.escape(e["titre"])}</a></h2>')
          lignes.append(f'<div class="meta">{html.escape(e["organisme"])} — {html.escape(e["date"])}</div>')
          if e["description"]:
              lignes.append(f'<p>{html.escape(e["description"])}</p>')
          lignes.append('</div>')
      rapport = p("tmp/veille-dg/digest.html")
      rapport.write_text("<html><head><meta charset='utf-8'>"
        "<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#1e293b;max-width:52rem}"
        "h1{color:#0f172a}.sub{color:#64748b}"
        ".carte{border:1px solid #e2e8f0;border-radius:10px;padding:1rem 1.2rem;margin:1rem 0}"
        ".carte h2{margin:.2rem 0;font-size:1.05rem}.carte a{color:#2563eb;text-decoration:none}"
        ".meta{color:#64748b;font-size:.85rem}p{color:#334155}</style></head><body>"
        + "\n".join(lignes) + "</body></html>", encoding="utf-8")
      print(rapport.resolve().as_uri())

  # ── 3. ouvrir le digest dans le navigateur par défaut ──────────────────────
  - id: ouvrir
    type: python
    description: Ouverture du digest dans le navigateur par défaut
    continue_on_error: true
    code: |
      import webbrowser
      if not webbrowser.open("{{rapport.output}}".strip()):
          print("Aucun navigateur lancé : ouvrez tmp/veille-dg/digest.html")

  # ── 4. fin ──────────────────────────────────────────────────────────────────
  - id: fin
    type: log
    level: success
    message: "Terminé : digest dans tmp/veille-dg/ (digest.html + datasets.json)."
    next: end

  - id: end
    type: end
