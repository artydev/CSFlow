      Expérience : 3 ans de chargé d'enseignement à l'université, aucune expérience en contrôle ou en inspection.
      Rédaction d'une thèse et d'articles juridiques.
      Compétences : tableur.
      Langues : anglais courant.""",
      "07": """Nom : Camille Lambert-Fictif
      Email : camille.lambert@exemple.invalid
      Téléphone : 06 00 00 00 07
