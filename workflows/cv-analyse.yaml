      Nationalité : fictive
      Adresse : 9 rue de la Démo, Ville-Exemple
      Formation : Licence en droit (bac+3). Formation continue en droit de la consommation (6 mois).
      Expérience : 3 ans d'inspection technique de sites de production, avec contrôles sur le terrain.
      Rédaction de procès-verbaux de constatation.
