      Formation : Master 2 en droit de la consommation (bac+5), université fictive.
      Expérience : 5 ans inspecteur en contrôle des pratiques commerciales dans un organisme fictif, dont des contrôles sur le terrain dans des commerces et des entrepôts.
      Rédaction de procès-verbaux et de rapports de contrôle (environ 40 par an).
      Compétences : tableur avancé, SQL, tableaux de bord.
