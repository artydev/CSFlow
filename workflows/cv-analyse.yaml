# yaml-language-server: $schema=../csflow.schema.json
name: candidatures-agents
description: >-
  Exemple FICTIF : examine des candidatures à un poste d'agent. Les CV sont anonymisés, CSAgent relève pour chaque
  critère d'une grille publique une citation exacte du CV, Python vérifie les citations et calcule le score, puis
  un agent humain valide la liste à examiner. Aucune candidature n'est écartée automatiquement.

# ─────────────────────────────────────────────────────────────────────────────
#  TOUTES LES DONNÉES CI-DESSOUS SONT FICTIVES (personnes, CV, poste).
#
#  Garde-fous de conception (le recrutement est un domaine sensible, y compris au regard du RGPD et du
#  règlement européen sur l'IA) :
#   - la grille de critères est écrite à l'avance et visible (étape « grille ») ;
#   - nom, âge, sexe, nationalité, situation familiale, adresse et contacts sont retirés AVANT l'analyse ;
#   - l'IA ne fait que citer le CV : chaque point exige une citation retrouvée MOT POUR MOT, sinon il est ignoré ;
#   - le score est un calcul Python reproductible, pas un avis de l'IA ;
#   - aucune candidature n'est rejetée par la machine : un humain examine toutes les candidatures ;
#   - une phrase d'un CV qui ressemble à une consigne pour l'évaluateur est signalée.
#
#  Chemins RELATIFS au dossier CSFlow/ (« / » valable sous Windows et Linux).
#  Nécessite un CSAgent worker (start_agent.bat / .sh) pour l'étape « extraction ».
# ─────────────────────────────────────────────────────────────────────────────

steps:

  # ── 1. grille d'examen (publique, définie avant de lire les CV) ─────────────
  - id: grille
    type: file_write
    description: "Grille d'examen du poste"
    path: 'tmp/candidatures/grille.json'
    content: |
      {
        "poste": "Enquêteur / enquêtrice, pôle protection des consommateurs (poste fictif)",
        "criteres": [
          {
            "id": "O1",
            "type": "obligatoire",
            "libelle": "Formation supérieure en droit, économie ou gestion (bac+3 minimum)",
            "poids": 3
          },
          {
            "id": "O2",
            "type": "obligatoire",
            "libelle": "Au moins 2 ans d'expérience en contrôle, inspection ou conformité",
            "poids": 3
          },
          {
            "id": "O3",
            "type": "obligatoire",
            "libelle": "Connaissance du droit de la consommation",
            "poids": 3
          },
          {
            "id": "S1",
            "type": "souhaité",
            "libelle": "Contrôles réalisés sur le terrain",
            "poids": 2
          },
          {
            "id": "S2",
            "type": "souhaité",
            "libelle": "Rédaction de rapports ou de procès-verbaux",
            "poids": 2
          },
          {
            "id": "S3",
            "type": "souhaité",
            "libelle": "Outils de données (tableur avancé, SQL, Python)",
            "poids": 1
          },
          {
            "id": "S4",
            "type": "souhaité",
            "libelle": "Anglais professionnel",
            "poids": 1
          }
        ]
      }

  # ── 2. CV fictifs ───────────────────────────────────────────────────────────
  - id: cv_fictifs
    type: python
    description: "CV fictifs (8 candidatures)"
    code: |
      import os

      CVS = {
      "01": """Nom : Alex Martin-Fictif
      Email : alex.martin@exemple.invalid
      Téléphone : 06 00 00 00 01
      Date de naissance : 12/03/1988
